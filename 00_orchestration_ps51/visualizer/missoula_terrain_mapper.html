<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ACT-Ω v27.0 | Missoula Geological Terrain & Anomaly Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { margin: 0; background: #030712; color: #f9fafb; font-family: monospace; }
    #map { height: 100vh; width: 100vw; }
    .hud-card { position: absolute; top: 1rem; right: 1rem; z-index: 1000; background: rgba(15,23,42,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 1rem; width: 320px; }
    .metric { display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.8rem; }
    .metric-val { font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hud-card">
    <div style="font-weight: bold; color: #4ade80; margin-bottom: 0.5rem;">MISSOULA GEOLOGICAL TERRAIN MAPPER</div>
    <div class="metric"><span>Anchor Baseline</span><span class="metric-val">B_tor: -41.84 µT</span></div>
    <div class="metric"><span>Elevation Ground State</span><span class="metric-val">905.20 hPa / 959m</span></div>
    <div class="metric"><span>b2 Cavities Encountered</span><span class="metric-val" id="b2-count" style="color: #ef4444;">--</span></div>
    <div class="metric"><span>b3 Pressure Cavities</span><span class="metric-val" id="b3-count" style="color: #06b6d4;">--</span></div>
    <div class="metric"><span>Homological Ratio</span><span class="metric-val" id="rhom-val" style="color: #c084fc;">13.34x</span></div>
  </div>
  <script>
    const map = L.map("map").setView([46.8721, -113.9940], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

    // Anchor Marker (Missoula Base)
    L.circleMarker([46.8721, -113.9940], { color: "#38bdf8", radius: 8, fillOpacity: 0.8 }).bindPopup("Missoula Base Anchor").addTo(map);
  </script>
</body>
</html>
