<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ACT-Ω v27.0 :: Pixel 10 Edge Sensor Latch</title>
  <style>
    body { background: #080c10; color: #00ffcc; font-family: monospace; text-align: center; padding: 20px; }
    .card { border: 1px solid #00ffcc; border-radius: 8px; padding: 15px; margin: 15px auto; max-width: 360px; background: rgba(0,255,204,0.05); }
    .val { font-size: 1.5rem; font-weight: bold; color: #ffffff; margin: 12px 0; }
    .status { font-size: 0.95rem; color: #88ff88; font-weight: bold; }
    button { background: #00ffcc; color: #080c10; border: none; padding: 14px 28px; font-weight: bold; border-radius: 4px; font-size: 1.1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h2>PIXEL 10 EDGE SENSOR LATCH</h2>
  <div class="card">
    <div class="status" id="sock-status">TRANSMITTING OVER USB 3.2 (TCP:8098)</div>
    <div class="val" id="angle-display">α: 0.0° β: 0.0° γ: 0.0°</div>
    <p>Rotate phone physically to reorient 3D Vector Scope on Page 4</p>
    <button id="perm-btn" onclick="requestSensors()">ENGAGE SENSORS</button>
  </div>
  <script>
    let ws = null;
    function initWS() {
      try {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${proto}//${location.host}/ws`);
        ws.onopen = () => { document.getElementById('sock-status').textContent = 'LATCHED TO HOST (TCP:8098 - WEBSOCKET)'; };
        ws.onclose = () => { setTimeout(initWS, 2000); };
      } catch(e) {}
    }
    initWS();

    let lastSend = 0;
    async function transmitOrientation(alpha, beta, gamma) {
      const now = Date.now();
      if (now - lastSend < 33) return; // 30 Hz throttle
      lastSend = now;

      document.getElementById('angle-display').textContent = `α: ${alpha.toFixed(1)}° β: ${beta.toFixed(1)}° γ: ${gamma.toFixed(1)}°`;
      
      const payload = { type: 'phone_rotation', alpha, beta, gamma, timestamp: now };

      // 1. Send via WebSocket if ready
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify(payload));
      }

      // 2. HTTP POST fallback for 100% reliable USB tunnel delivery
      try {
        await fetch('/api/telemetry/orientation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('sock-status').textContent = 'LATCHED (ACTIVE 30Hz STREAM)';
      } catch (err) {
        document.getElementById('sock-status').textContent = 'DISCONNECTED - VERIFY ADB REVERSE';
      }
    }

    function requestSensors() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(res => {
          if (res === 'granted') {
            window.addEventListener('deviceorientation', e => transmitOrientation(e.alpha||0, e.beta||0, e.gamma||0));
          }
        });
      } else {
        window.addEventListener('deviceorientation', e => transmitOrientation(e.alpha||0, e.beta||0, e.gamma||0));
      }
      document.getElementById('perm-btn').style.display = 'none';
    }
  </script>
</body>
</html>
